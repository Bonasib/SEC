# /etc/nginx/sites-available/sec-wms  (replace wms.example.com with your domain)
# After enabling: sudo certbot --nginx -d wms.example.com  (adds HTTPS automatically)
server {
    listen 80;
    listen [::]:80;
    server_name wms.example.com;

    # Photo uploads (up to 20 x 15 MB) and Excel imports
    client_max_body_size 300M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
    }
}
